name: Notify CTO

# Caller workflow — emails the CTO when a PR to main is opened, marked
# ready-for-review, or labeled qa-approved. Delegates to the org reusable
# workflow. Requires the SMTP org/repo secrets (see SECRETS-REQUIRED.md).

on:
  pull_request:
    types: [opened, ready_for_review, labeled]
    branches: [main]

permissions:
  contents: read
  pull-requests: read
  checks: read
  statuses: read

jobs:
  notify:
    # Only the three requested triggers; for 'labeled', only qa-approved.
    if: >-
      github.event.action == 'opened' ||
      github.event.action == 'ready_for_review' ||
      (github.event.action == 'labeled' && github.event.label.name == 'qa-approved')
    uses: Genessence/.github/.github/workflows/notify-cto.yml@main
    secrets: inherit
    # with:
    #   cto_email: shrey.mishra.dev@gmail.com   # default already set in the reusable workflow
